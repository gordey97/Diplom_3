name: Generate UI Allure report

on:
  workflow_dispatch:
  push:
    branches:
      - develop3
    paths-ignore:
      - "allure-report/**"

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: maven
      - name: Run UI tests in Chrome
        run: mvn -B clean test -Dbrowser=chrome -Dheadless=true
      - name: Build Allure report
        run: mvn -B io.qameta.allure:allure-maven:2.15.0:report
      - name: Commit Allure report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f allure-report
          if ! git diff --cached --quiet; then
            git commit -m "Add UI Allure report [skip ci]"
            git push
          fi
